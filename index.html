<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#efe9c6">
<title>Glimmer Hollow</title>
<style>
:root{--cream:#fff6e0;--gold:#e8b84b;--ink:#6a4d2a;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#efe9c6;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:ui-rounded,"Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;color:var(--ink);position:fixed;left:0;top:0}
body{height:100vh;height:100dvh}
#c{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
#ui{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none}
.pill{pointer-events:auto;min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:2.5px solid var(--gold);background:var(--cream);color:var(--ink);font:700 15px/1 ui-rounded,"Nunito","Trebuchet MS",system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(200,150,50,.35),0 6px 14px rgba(120,90,40,.18);cursor:pointer;touch-action:manipulation;white-space:nowrap;-webkit-appearance:none;appearance:none}
.pill:active{transform:translateY(2px)}
.pill.on{background:#ffe9a8}
.round{padding:0;width:48px}
.ic{display:inline-block;width:28px;height:28px;margin-right:7px;flex:none;line-height:0}
.ic svg{width:100%;height:100%;display:block;overflow:visible}
.round .ic{margin:0;width:32px;height:32px}
.pill:empty{display:none}
.t-pink{background:#ffd3de}.t-sky{background:#cfe8fb}.t-lav{background:#e4d9fb}.t-mint{background:#c9f0d9}.t-butter{background:#fff0b0}.t-peach{background:#ffdcbc}
.pill.on{box-shadow:0 0 0 3px #ff9a4a,0 6px 14px rgba(120,90,40,.22)}
.shutter .ic{width:46px;height:46px;margin:0}
#hint .f{width:64px;height:64px;margin:0 auto 4px}
#hint .f .ic{width:64px;height:64px;margin:0}
.sheet h3 .ic{vertical-align:middle;margin-right:6px}
#top{position:absolute;left:calc(12px + var(--sl));right:calc(12px + var(--sr));top:calc(10px + var(--st));display:flex;align-items:flex-start;justify-content:space-between}
#top .r{display:flex;gap:8px}
#btnTown{padding:0 12px;min-height:50px;max-width:56vw}
.tn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;line-height:1.1}
#townName{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
#count{font-weight:700;opacity:.8;font-size:13px}
#bottom{position:absolute;left:calc(12px + var(--sl));right:calc(12px + var(--sr));bottom:calc(14px + var(--sb));display:flex;justify-content:center;gap:10px}
#hint{position:absolute;left:0;right:0;bottom:calc(26% + var(--sb));text-align:center;font-weight:800;font-size:18px;text-shadow:0 2px 0 #fff8;display:none}
#hint .f{font-size:46px;display:block;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1) translateY(0);opacity:.85}50%{transform:scale(1.25) translateY(-8px);opacity:1}}
#label{position:fixed;left:0;top:0;display:none;z-index:5;will-change:transform}
#photobar{position:fixed;left:0;right:0;bottom:calc(14px + var(--sb));display:none;justify-content:center;align-items:center;gap:8px;pointer-events:none;flex-wrap:wrap;padding:0 calc(8px + var(--sr)) 0 calc(8px + var(--sl))}
body.photo #ui{display:none}
body.photo #photobar{display:flex}
body.photo #label{display:none!important}
.shutter{width:68px;height:68px;border-radius:50%;font-size:28px;padding:0}
#rot{position:fixed;left:0;right:0;top:calc(52% - 24px);display:flex;justify-content:space-between;padding:0 calc(8px + var(--sr)) 0 calc(8px + var(--sl));pointer-events:none;z-index:4}
#rot .pill{opacity:.9}
#done{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--sb));display:none;flex-direction:column;align-items:center;gap:8px;padding:12px 16px;background:var(--cream);border:3px solid var(--gold);border-radius:22px;z-index:6;box-shadow:0 8px 20px rgba(80,60,20,.3)}
#done .dt{font-weight:800;font-size:18px}#done .dr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + var(--sb));max-width:86vw;padding:10px 16px;border-radius:999px;background:var(--cream);border:2.5px solid var(--gold);font-weight:700;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40;text-align:center}
.trow{background:#fff;border:2px solid var(--gold);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.trow.cur{background:#fff3c4}.ta{display:flex;gap:6px;flex-wrap:wrap}.ta .pill{min-height:42px;padding:0 12px;font-size:14px}.ta .round{width:44px}
.tt small{display:block;opacity:.7;font-weight:600;font-size:12px;margin-top:2px}.badge{background:#ffd36e;border-radius:999px;padding:2px 8px;font-size:11px;vertical-align:middle}
.ver{opacity:.6;font-size:12px;text-align:center;font-weight:700;margin-top:4px}
#flash{position:fixed;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .45s ease-out;z-index:20}
#modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(90,70,40,.38);display:none;align-items:flex-start;justify-content:center;z-index:30;padding:calc(8vh + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl));box-sizing:border-box}
#modal.open{display:flex}
.sheet{background:var(--cream);border:3px solid var(--gold);border-radius:24px;padding:16px;max-width:420px;width:100%;max-height:84vh;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(80,60,20,.35)}
.sheet h3{margin:0;font-size:19px}
.sheet h4{margin:6px 0 0;font-size:13px;opacity:.7;text-transform:uppercase;letter-spacing:.06em}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;display:flex;flex-direction:column;gap:8px;min-height:0}
.item{justify-content:flex-start;text-align:left;width:100%;box-sizing:border-box;min-height:52px;white-space:normal}
.item small{display:block;font-weight:600;opacity:.65;font-size:12px;margin-top:3px}
input[type=text]{font:700 18px ui-rounded,system-ui,sans-serif;padding:10px 14px;border-radius:14px;border:2.5px solid var(--gold);background:#fff;color:var(--ink);width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text;min-height:44px}
.sw{width:22px;height:22px;border-radius:50%;margin-right:4px;border:2px solid #fff8;display:inline-block}
#paused{position:fixed;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(255,246,224,.55);z-index:25;font-size:28px;font-weight:800}
#msg{position:fixed;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;font-weight:700;background:#efe9c6;z-index:50;line-height:1.5}
.sheet img{max-width:100%;max-height:50vh;border-radius:12px;object-fit:contain;-webkit-user-select:auto;-webkit-touch-callout:default}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="top">
    <button class="pill t-butter" id="btnTown" aria-label="Rename town"><span class="tn"><b id="townName"></b><span id="count"></span></span><i class="ic" data-i="pencil" style="margin:0 0 0 8px;width:20px;height:20px"></i></button>
    <div class="r"><button class="pill round t-mint" id="btnExplore" aria-label="Explore town"><i class="ic" data-i="compass"></i></button><button class="pill round t-butter" id="btnSound" aria-label="Sound"><i class="ic" data-i="soundOn"></i></button><button class="pill round t-sky" id="btnPause" aria-label="Pause"><i class="ic" data-i="pause"></i></button></div>
  </div>
  <div id="hint"><span class="f"><i class="ic" data-i="finger"></i></span>Press and hold anywhere</div>
  <div id="bottom">
    <button class="pill t-pink" id="btnPhoto"><i class="ic" data-i="camera"></i>Photo</button>
    <button class="pill t-sky" id="btnList"><i class="ic" data-i="town"></i>Town</button>
    <button class="pill t-lav" id="btnMenu"><i class="ic" data-i="menu"></i>Menu</button>
  </div>
</div>
<button class="pill" id="label"></button>
<div id="photobar">
  <button class="pill t-sky" id="pbMode"></button>
  <button class="pill shutter t-pink" id="pbShutter" aria-label="Shutter"><i class="ic" data-i="shutter"></i></button>
  <button class="pill t-butter" id="pbCap"></button>
  <button class="pill t-peach" id="pbExit"><i class="ic" data-i="exit"></i>Exit</button>
</div>
<div id="rot"><button class="pill round t-lav" id="btnRotL" aria-label="Rotate left"><i class="ic" data-i="rotL"></i></button><button class="pill round t-lav" id="btnRotR" aria-label="Rotate right"><i class="ic" data-i="rotR"></i></button></div>
<div id="done"><div class="dt">Town complete!</div><div class="dr"><button class="pill t-sky" id="dnTowns"><i class="ic" data-i="town"></i>My Towns</button><button class="pill t-mint" id="dnNew"><i class="ic" data-i="plus"></i>New town</button></div></div>
<div id="toast"></div>
<div id="flash"></div>
<div id="modal"></div>
<div id="paused"><div>Paused</div><button class="pill t-mint" id="btnResume"><i class="ic" data-i="play"></i>Resume</button></div>
<div id="msg"></div>
<script>
// Classic script: friendly fallback if the module (three.js CDN) never boots.
(function(){
  function show(t){var m=document.getElementById('msg');m.innerHTML=t;m.style.display='flex';}
  window.__ghShow=show;
  setTimeout(function(){ if(!window.__ghBoot) show('Glimmer Hollow could not load.<br>Please check your connection and reload.'); },9000);
})();
</script>
<script nomodule>document.getElementById('msg').innerHTML='Your browser is too old for this game.<br>Please update Safari/Chrome.';document.getElementById('msg').style.display='flex';</script>

/* ============================================================
   TOWN SIZE CAP (30-40 buildings per town, seeded)
   ============================================================ */
function capFor(setting, n) { return Math.max(30 + Math.floor(mulberry32(((setting && setting.seed) | 0) + 13)() * 11), n | 0); }
function townCap() { return capFor(S.setting, S.buildings.length); }
function camFocusTown(dur) {

  if (!S.buildings.length) { camFocus(0, 1, 0, 14, 4, dur); return; }
  let sx = 0, sz = 0; S.buildings.forEach(b => { sx += b.rt.x; sz += b.rt.z; }); sx /= S.buildings.length; sz /= S.buildings.length;
  let r = 0; S.buildings.forEach(b => { r = Math.max(r, Math.hypot(b.rt.x - sx, b.rt.z - sz) + b.rt.R); });
  camFocus(sx, 1, sz, r + 3, 4, dur);
}

/* ============================================================
   PERSISTENCE (several saved towns)
   ============================================================ */
let saveTimer = 0;
const KEY_INDEX = CONFIG.saveKey + '.towns', keyTown = id => CONFIG.saveKey + '.town.' + id;
let INDEX = { v: 1, current: null, list: [] };
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 600); }
function writeIndex() { try { localStorage.setItem(KEY_INDEX, JSON.stringify(INDEX)); } catch (e) {} }
function newTownId() { return 't' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36); }
function metaOf(d, id) { return { id, name: String(d.townName || 'Town'), count: d.buildings.length, cap: capFor(d.setting, d.buildings.length), kind: (d.setting && d.setting.kind) || 'none', updated: Date.now() }; }
function townData() {
  return { schemaVersion: CONFIG.schemaVersion, townName: S.townName, theme: S.themeIdx, settings: S.settings, nextId: S.nextId, lotCount: S.lotCount, history: S.history, setting: S.setting, connected: S.connected,
    buildings: S.buildings.map(b => ({ id: b.id, type: b.type, lot: b.lot, colors: b.colors, seed: b.seed, name: b.name, custom: b.custom, salt: b.salt || 0 })), cur: S.cur };
}
function saveNow() {
  clearTimeout(saveTimer); if (!S.townId) return;
  try {
    const d = townData(); localStorage.setItem(keyTown(S.townId), JSON.stringify(d));
    const m = metaOf(d, S.townId), i = INDEX.list.findIndex(t => t.id === S.townId); if (i >= 0) INDEX.list[i] = m; else INDEX.list.push(m);
    INDEX.current = S.townId; writeIndex();
  } catch (e) {}
}
function validateTown(d) {
  if (!d || (d.schemaVersion !== CONFIG.schemaVersion && d.schemaVersion !== 1) || !Array.isArray(d.buildings)) return null;
  const okLot = l => Array.isArray(l) && l.length === 2 && Number.isFinite(l[0]) && Number.isFinite(l[1]);
  const okCol = c => c && Number.isFinite(c.wall) && Number.isFinite(c.wall2) && Number.isFinite(c.roof);
  const bs = d.buildings.filter(b => b && CONFIG.buildings[b.type] && okLot(b.lot) && okCol(b.colors) && Number.isFinite(b.seed));
  if (bs.length !== d.buildings.length) return null;
  if (d.cur && !(CONFIG.buildings[d.cur.type] && okLot(d.cur.lot) && okCol(d.cur.colors) && Number.isFinite(d.cur.seed) && Number.isFinite(d.cur.placed))) d.cur = null;
  if (d.schemaVersion === 1) { const sc = l => [l[0] * 12, l[1] * 12]; d.buildings.forEach(b => b.lot = sc(b.lot)); if (d.cur) d.cur.lot = sc(d.cur.lot); d.schemaVersion = CONFIG.schemaVersion; }   // old grid saves -> world coords
  d.connected = Array.isArray(d.connected) ? d.connected.filter(c => c && typeof c.id === 'string' && Number.isFinite(c.ang) && Number.isFinite(c.d)).slice(0, 2) : [];
  d.setting = d.setting && d.setting.kind ? d.setting : { kind: 'none', seed: 1 };
  return d;
}
function readTown(id) { try { const raw = localStorage.getItem(keyTown(id)); return raw ? validateTown(JSON.parse(raw)) : null; } catch (e) { return null; } }
function readIndex() {
  try { const d = JSON.parse(localStorage.getItem(KEY_INDEX)); if (d && Array.isArray(d.list)) return { v: 1, current: d.current || null, list: d.list.filter(t => t && typeof t.id === 'string') }; } catch (e) {}
  return null;
}
function migrateOld() {   // single-save version -> first entry of the town list
  try {
    const raw = localStorage.getItem(CONFIG.saveKey); if (!raw) return; const d = validateTown(JSON.parse(raw)); if (!d) return;
    const id = newTownId(); localStorage.setItem(keyTown(id), JSON.stringify(d)); INDEX.list.push(metaOf(d, id)); INDEX.current = id; writeIndex(); localStorage.removeItem(CONFIG.saveKey);
  } catch (e) {}
}
function applySave(d, keepSettings) {
  S.townName = String(d.townName || townNameGen()).slice(0, 24); S.themeIdx = clamp(d.theme | 0, 0, CONFIG.palettes.length - 1);
  if (!keepSettings) Object.assign(S.settings, d.settings || {});
  S.nextId = d.nextId | 0 || 1; S.lotCount = d.lotCount | 0; S.history = Array.isArray(d.history) ? d.history.slice(-6) : [];
  S.buildings = d.buildings.map(b => ({ id: b.id, type: b.type, lot: b.lot, colors: b.colors, seed: b.seed, name: String(b.name || ''), custom: !!b.custom, salt: b.salt | 0 }));
  S.cur = d.cur || null; S.setting = d.setting; S.connected = d.connected || [];
}
window.addEventListener('pagehide', saveNow);

/* ============================================================
   RESET / BOOT HELPERS
   ============================================================ */
function teardownTown() {
  S.buildings.forEach(b => disposeBuildingObject(b)); S.buildings = [];
  clearTerrain(); clearConnected(); lsClear();
  if (site) { scene.remove(site.group); site.mesh.dispose(); site = null; }
  loose.length = 0; flying = 0; timers.length = 0; tweens.length = 0; flags.length = 0; Object.keys(layoutCache).forEach(k => delete layoutCache[k]);
  S.selected = null; S.complete = false; hold.active = false; orb.active = false; orb.vis = 0; orbGroup.visible = false; orbRing.visible = false; orbBlob.visible = false; orbLight.visible = false; updateLabelText();
}
function startTown(d, kind, id, keepSettings) {
  hold.active = false; S.complete = false; S.selected = null;
  if (d) applySave(d, keepSettings);
  else { S.buildings = []; S.history = []; S.nextId = 1; S.lotCount = 0; S.cur = null; S.connected = []; S.townName = townNameGen(); S.setting = newSetting(kind); }
  S.townId = id || newTownId();
  terrainInit(S.setting.kind, S.setting.seed); setTheme(S.themeIdx, true);
  S.buildings.forEach(b => { if (!b.name) b.name = genName(b); buildBuildingObject(b); });
  buildTerrain(); rebuildLandscape();
  let rec = null, placed = 0;
  if (S.cur) { rec = { type: S.cur.type, lot: S.cur.lot, seed: S.cur.seed, colors: S.cur.colors }; placed = clamp(S.cur.placed | 0, 0, layoutFor(rec).slots.length - 1); }
  else if (S.buildings.length >= townCap()) S.complete = true;
  else { rec = newRec(); S.cur = { type: rec.type, lot: rec.lot, seed: rec.seed, colors: rec.colors, placed: 0 }; }
  if (rec) {
    createSite(rec, placed); site.state = 'rising'; S.cur.placed = placed; setupSitePaths();
    const n = Math.min(CONFIG.loose.max, 16, site.layout.slots.length - site.assigned); for (let i = 0; i < n; i++) spawnBrick(false);
  }
  cam.away = false; camFocusSite(0); cam.zoomT = cam.zoom = 1; updateShadowCasters(); updateCamera(0.016);
  if (S.explore) setExplore(false);
  refreshUI(); updateLabelText(); saveNow();
}
function switchTown(id) {
  if (id === S.townId) return; saveNow();
  const d = readTown(id); if (!d) { toast('Could not open that town'); return; }
  teardownTown(); startTown(d, null, id, true); toast('Welcome to ' + S.townName);
}
function newTown(kind) {
  if (INDEX.list.length >= CONFIG.maxTowns) { toast('You can keep ' + CONFIG.maxTowns + ' towns - delete one first'); return; }
  saveNow(); teardownTown(); startTown(null, kind, null, true); toast('New town: ' + S.townName);
}
function deleteTown(id) {
  try { localStorage.removeItem(keyTown(id)); } catch (e) {}
  INDEX.list = INDEX.list.filter(t => t.id !== id);
  INDEX.list.forEach(t => { const d = readTown(t.id); if (d && d.connected.some(c => c.id === id)) { d.connected = d.connected.filter(c => c.id !== id); try { localStorage.setItem(keyTown(t.id), JSON.stringify(d)); } catch (e) {} } });
  if (id === S.townId) {
    S.townId = null; teardownTown();
    const nxt = INDEX.list[0], d = nxt && readTown(nxt.id);
    if (d) startTown(d, null, nxt.id, true); else startTown(null, 'random', null, true);
  } else { S.connected = S.connected.filter(c => c.id !== id); buildTerrain(); rebuildLandscape(); }
  INDEX.current = S.townId; writeIndex(); saveNow();
}
function curExtent() {
  let e = TERR.plaza ? TERR.plaza.size * 1.3 : 12;
  S.buildings.forEach(b => { const q = lotPos(b.lot); e = Math.max(e, Math.hypot(q.x, q.z) + layoutFor(b).R); });
  if (site) e = Math.max(e, Math.hypot(site.x, site.z) + site.R);
  return e;
}
function townExtent(d) { let e = plazaParams(d.setting.seed).size * 1.3; d.buildings.forEach(b => { e = Math.max(e, Math.hypot(b.lot[0], b.lot[1]) + layoutFor(b).R); }); return e; }
function connectTown(otherId) {
  const dB = readTown(otherId); if (!dB) { toast('Could not open that town'); return; }
  if (S.connected.some(c => c.id === otherId)) return;
  if (S.connected.length >= 2 || dB.connected.length >= 2) { toast('A town can connect to 2 others'); return; }
  const extB = townExtent(dB), dist = Math.max(60, curExtent() + extB + 26), tries = []; for (let i = 0; i < 16; i++) tries.push(Math.random() * TAU);
  let ang = null; for (const a of tries) if (!terrainBlocked(Math.cos(a) * dist, Math.sin(a) * dist, extB + 4) && S.connected.every(c => Math.abs(wrapAng(a - c.ang)) > 1.0)) { ang = a; break; }
  if (ang === null) ang = tries[0];
  const cx = Math.cos(ang) * dist, cz = Math.sin(ang) * dist; let from = null, bd = 1e9;
  S.buildings.forEach(b => { const q = lotPos(b.lot), dd = Math.hypot(q.x - cx, q.z - cz); if (dd < bd) { bd = dd; from = b.id; } });
  S.connected.push({ id: otherId, ang, d: dist, from });
  const angB = wrapAng(ang + Math.PI), bx = Math.cos(angB) * dist, bz = Math.sin(angB) * dist; let fromB = null; bd = 1e9;
  dB.buildings.forEach(b => { const dd = Math.hypot(b.lot[0] - bx, b.lot[1] - bz); if (dd < bd) { bd = dd; fromB = b.id; } });
  dB.connected.push({ id: S.townId, ang: angB, d: dist, from: fromB });
  try { localStorage.setItem(keyTown(otherId), JSON.stringify(dB)); } catch (e) {}
  saveNow(); buildTerrain(); rebuildLandscape(); toast('Connected to ' + dB.townName + ' - use Explore to follow the road');
}
function disconnectTown(otherId) {
  S.connected = S.connected.filter(c => c.id !== otherId);
  const dB = readTown(otherId); if (dB) { dB.connected = dB.connected.filter(c => c.id !== S.townId); try { localStorage.setItem(keyTown(otherId), JSON.stringify(dB)); } catch (e) {} }
  saveNow(); buildTerrain(); rebuildLandscape(); toast('Towns disconnected');
}
function clearConnected() {
  TERR.conn.forEach(c => { scene.remove(c.mesh); c.mesh.geometry.dispose(); if (c.sprite) { scene.remove(c.sprite); c.sprite.material.map.dispose(); c.sprite.material.dispose(); } });
  TERR.conn = []; TERR.connLinks = [];
}
function buildConnected() {   // connected saved towns appear as neighbours (one merged, light mesh each) joined by a road
  clearConnected();
  for (const cn of S.connected) {
    const d = readTown(cn.id); if (!d) continue;
    const nx = Math.cos(cn.ang) * cn.d, nz = Math.sin(cn.ang) * cn.d, gb = new GeoBuilder(), pp = plazaParams(d.setting.seed), bg = GEO.brickPlain;
    if (pp.shape === 'round') gb.add(mk(new THREE.CylinderGeometry(pp.size, pp.size, 0.04, 32), '#ffffff'), _m.makeTranslation(nx, 0.02, nz), new C3('#d9cfb8'));
    else gb.add(mk(new THREE.BoxGeometry(pp.size * 2, 0.04, pp.size * 2), '#ffffff'), _m.makeRotationY(pp.rot).setPosition(nx, 0.02, nz), new C3('#d9cfb8'));
    d.buildings.forEach(b => {
      const L = layoutFor(b), yaw = Math.atan2(-b.lot[0], -b.lot[1]) + (((b.seed >>> 3) % 1000) / 1000 - 0.5) * 0.5;
      const M0 = new M4().compose(new V3(nx + b.lot[0], 0, nz + b.lot[1]), new Q4().setFromAxisAngle(Y_AXIS, yaw), new V3(1, 1, 1)).multiply(new M4().makeTranslation(0, PED_H, 0));
      for (const sl of L.slots) { if (sl.flag) continue; slotMatrix(sl, _m); _m.premultiply(M0); gb.add(bg, _m, resolveColor(b, sl.c, sl.j, _c)); }
      gb.add(mk(new THREE.CylinderGeometry(L.R * 0.88, L.R * 0.93, PED_H, 20), '#ffffff'), _m.makeTranslation(nx + b.lot[0], PED_H / 2, nz + b.lot[1]), PC.stone);
    });
    const mesh = new THREE.Mesh(gb.build(), litMat('vc')); mesh.userData.lk = 'vc'; shadowFlags(mesh, false, true); scene.add(mesh);
    const cvs = document.createElement('canvas'); cvs.width = 512; cvs.height = 128; const g2 = cvs.getContext('2d');
    rrect(g2, 6, 6, 500, 116, 50); g2.fillStyle = 'rgba(255,246,224,.95)'; g2.fill(); g2.lineWidth = 8; g2.strokeStyle = '#e8b84b'; g2.stroke();
    g2.fillStyle = '#6a4d2a'; g2.textAlign = 'center'; g2.textBaseline = 'middle'; let fs = 56; do { g2.font = '800 ' + fs + 'px ui-rounded,"Trebuchet MS",system-ui,sans-serif'; fs -= 4; } while (g2.measureText(d.townName).width > 440 && fs > 16);
    g2.fillText(d.townName, 256, 66);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: canvasTex(cvs), depthTest: false, transparent: true, fog: false })); sp.scale.set(15, 3.75, 1); sp.position.set(nx, 13, nz); sp.renderOrder = 20; scene.add(sp);
    const fb = S.buildings.find(o => o.id === cn.from), ap = fb ? lotPos(fb.lot) : { x: 0, z: 0 }, ar = fb ? layoutFor(fb).R : 4;
    let best = null, bd = 1e9; d.buildings.forEach(b => { const dd = Math.hypot(nx + b.lot[0] - ap.x, nz + b.lot[1] - ap.z); if (dd < bd) { bd = dd; best = b; } });
    if (best) TERR.connLinks.push({ a: [ap.x, ap.z], b: [nx + best.lot[0], nz + best.lot[1]], ar, br: layoutFor(best).R });
    TERR.conn.push({ id: cn.id, x: nx, z: nz, r: townExtent(d) + 6, mesh, sprite: sp });
  }
}

/* ---------- My Towns / new town UI ---------- */
function openNewTownSheet() {
  if (INDEX.list.length >= CONFIG.maxTowns) {
    openModal('<h3>That is a lot of towns!</h3><div>You can keep ' + CONFIG.maxTowns + ' towns. Delete one in My Towns first.</div><div class="row"><button class="pill t-sky" id="ntTowns">My Towns</button><button class="pill" data-close="1">Close</button></div>', el => { el.querySelector('#ntTowns').onclick = () => openTowns(); });
    return;
  }
  const opts = [['river', 'A river'], ['hill', 'A hill'], ['forest', 'A forest'], ['farmland', 'Farmland'], ['road', 'A road'], ['neighbor', 'Another town'], ['random', 'Surprise me']];
  openModal('<h3>Start a new town</h3><div>Your current town stays saved. Where should the new town sit?</div><div class="row">' + opts.map(q => '<button class="pill t-sky" data-setting="' + q[0] + '">' + q[1] + '</button>').join('') + '</div><div class="row"><button class="pill t-peach" data-close="1">Cancel</button></div>',
    el => el.querySelectorAll('[data-setting]').forEach(b => b.onclick = () => { closeModal(); newTown(b.dataset.setting); }));
}
function openTowns() {
  saveNow();
  const rows = INDEX.list.map(t => {
    const isCur = t.id === S.townId, linked = S.connected.some(c => c.id === t.id);
    return '<div class="trow' + (isCur ? ' cur' : '') + '"><div class="tt"><b>' + esc(t.name) + '</b>' + (isCur ? ' <span class="badge">you are here</span>' : '') + '<small>' + t.count + '/' + t.cap + ' buildings · beside ' + esc(TERR_LABEL[t.kind] || 'open meadow') + (linked ? ' · connected' : '') + '</small></div><div class="ta">'
      + (isCur ? '' : '<button class="pill t-mint" data-open="' + t.id + '">' + ic('play') + 'Open</button><button class="pill ' + (linked ? 't-peach' : 't-sky') + '" data-link="' + t.id + '">' + ic('link') + (linked ? 'Unlink' : 'Connect') + '</button>')
      + '<button class="pill round t-peach" data-del="' + t.id + '" aria-label="Delete town">' + ic('trash') + '</button></div></div>';
  }).join('');
  openModal('<h3>My Towns</h3><div class="scroll">' + rows + '</div><div class="row"><button class="pill t-mint" id="tnNew">' + ic('plus') + 'New town</button><button class="pill" data-close="1">Close</button></div><small>Open a town to play it. Connect two towns and each shows up as the other\'s neighbour, joined by a road.</small>', el => {
    el.querySelector('#tnNew').onclick = () => openNewTownSheet();
    el.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { closeModal(); switchTown(b.dataset.open); });
    el.querySelectorAll('[data-link]').forEach(b => b.onclick = () => { const id = b.dataset.link; if (S.connected.some(c => c.id === id)) disconnectTown(id); else connectTown(id); openTowns(); });
    el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      const t = INDEX.list.find(q => q.id === b.dataset.del); if (!t) return;
      modalEl.firstChild.innerHTML = '<h3>Delete "' + esc(t.name) + '"?</h3><div>This town and its buildings will be gone for good.</div><div class="row"><button class="pill t-peach" id="dlYes">Delete</button><button class="pill t-mint" id="dlNo">Keep it</button></div>';
      $('dlYes').onclick = () => { closeModal(); deleteTown(t.id); toast('Town deleted'); }; $('dlNo').onclick = () => openTowns();
    });
  });
}

/* ============================================================
   MAIN LOOP (+ adaptive quality)
   ============================================================ */
const perf = { ema: 16.7, cpu: 4, slow: 0, fast: 0, grace: 3, minDt: 99, lastChange: -99, block: {}, clock: 0 };
function perfSample(dtMs, cpuMs, dt) {
  if (S.paused || S.mode !== 'play' || S.hidden || dtMs > 250) return;
  perf.ema += (Math.min(dtMs, 60) - perf.ema) * 0.05; perf.cpu += (cpuMs - perf.cpu) * 0.05; perf.clock += dt;
  if (perf.grace > 0) { perf.grace -= dt; return; }
  if (S.settings.quality !== 'auto') return;
  const C = CONFIG.perf, i = CONFIG.tiers.indexOf(tierName);
  if (perf.ema > C.slowMs) { perf.slow += dt; perf.fast = 0; } else if (perf.ema < C.fastMs || (perf.ema < C.vsyncMs && perf.cpu < C.cpuMsOk)) { perf.fast += dt; perf.slow = 0; } else { perf.slow = 0; perf.fast = 0; }
  if (perf.slow >= C.slowSecs && i > 0) {
    perf.block[CONFIG.tiers[i]] = (perf.block[CONFIG.tiers[i]] || 0) * 2 + 30; perf.block.t = perf.clock; perf.lastChange = perf.clock; applyQuality(CONFIG.tiers[i - 1]); perf.ema = 16.7;
  } else if (perf.fast >= C.fastSecs && i < 2 && perf.clock - perf.lastChange > C.cooldownSecs) {
    const nt = CONFIG.tiers[i + 1], blk = perf.block[nt] || 0;
    if (perf.clock - (perf.block.t || -999) > blk) { perf.lastChange = perf.clock; applyQuality(nt); perf.ema = 16.7; } else perf.fast = 0;
  }
}
let last = 0, raf = 0, simT = 0;
function frame() {
  raf = requestAnimationFrame(frame);
  const t0 = performance.now(); let dtMs = t0 - last; last = t0; if (dtMs <= 0) dtMs = 16.7;
  tick(dtMs, t0);
}
function tick(dtMs, t0) {
  const dt = S.paused ? 0 : Math.min(dtMs / 1000, 0.05); simT += dt;
  updateTimers(dt); updateTweens(dt);
  updateCamera(Math.min(dtMs / 1000, 0.05)); updateOrb(dt, simT); updateSite(dt); updateBricks(dt, simT); lsUpdate(dt); updateParticles(dt); updateFlags(dt, simT);
  updateLabelPos(); syncDone();
  renderer.render(scene, camera);
  perfSample(dtMs, performance.now() - t0, dt);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { S.hidden = true; cancelAnimationFrame(raf); saveNow(); hold.active = false; }
  else { S.hidden = false; last = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(frame); perf.grace = 2; }
});
window.addEventListener('resize', () => { resize(); setTimeout(resize, 250); });
window.addEventListener('orientationchange', () => setTimeout(resize, 300));
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => resize());

/* ============================================================
   BOOT
   ============================================================ */
(function boot() {
  INDEX = readIndex();
  if (!INDEX) { INDEX = { v: 1, current: null, list: [] }; migrateOld(); }
  let d = null, id = null;
  for (const tid of [INDEX.current].concat(INDEX.list.map(t => t.id))) { if (!tid) continue; const dd = readTown(tid); if (dd) { d = dd; id = tid; break; } }
  if (d) Object.assign(S.settings, d.settings || {});
  if (S.settings.quality !== 'auto' && CONFIG.quality[S.settings.quality]) { tierName = S.settings.quality; Q = CONFIG.quality[tierName]; } else S.settings.quality = 'auto';
  applyQuality(tierName, true); prevBevel = Q.bevel;
  swapBrickGeometry(); resize();
  startTown(d, 'random', id, true);
  last = performance.now(); raf = requestAnimationFrame(frame);
  window.__gh = { genLayout, CONFIG, buildBuildingObject, rebuildLandscape, camFocus, genName, S, site: () => site, THREE, tick: ms => tick(ms, performance.now()), cam, orb, loose };
})();
